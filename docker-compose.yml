services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ct_assignment}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ct_assignment}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.5
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr=internal://0.0.0.0:8082
      - --advertise-pandaproxy-addr=internal://redpanda:8082
    ports:
      - "${REDPANDA_EXTERNAL_PORT:-19092}:19092"
      - "${REDPANDA_ADMIN_PORT:-9644}:9644"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q healthy"]
      interval: 15s
      timeout: 10s
      retries: 10

  redpanda-init:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.5
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      'current_partitions=$$(rpk -X brokers=redpanda:9092 topic describe review-events 2>/dev/null | grep "^PARTITIONS" | tr -s " " | cut -d" " -f2); if [ -z "$$current_partitions" ]; then
        rpk -X brokers=redpanda:9092 topic create review-events --partitions 4 --replicas 1;
      elif [ "$$current_partitions" -lt 4 ]; then
        rpk -X brokers=redpanda:9092 topic add-partitions review-events --num $$((4 - $$current_partitions));
      fi; rpk -X brokers=redpanda:9092 topic describe review-events'

  product-service:
    build:
      context: .
      dockerfile: services/product-service/Dockerfile
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PRODUCT_SERVICE_PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ct_assignment?schema=public
      REDIS_URL: redis://redis:6379/0
      REDPANDA_BROKERS: redpanda:9092
      REVIEW_EVENTS_TOPIC: review-events
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      INSTANCE_ID: product-service
    ports:
      - "3000:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully

  review-processor-service:
    build:
      context: .
      dockerfile: services/review-processor-service/Dockerfile
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      REVIEW_PROCESSOR_PORT: 3001
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ct_assignment?schema=public
      REDIS_URL: redis://redis:6379/0
      REDPANDA_BROKERS: redpanda:9092
      REVIEW_EVENTS_TOPIC: review-events
      REVIEW_CONSUMER_GROUP: review-processor
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      INSTANCE_ID: processor-a
    ports:
      - "3001:3001"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully

  review-processor-service-2:
    build:
      context: .
      dockerfile: services/review-processor-service/Dockerfile
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      REVIEW_PROCESSOR_PORT: 3001
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ct_assignment?schema=public
      REDIS_URL: redis://redis:6379/0
      REDPANDA_BROKERS: redpanda:9092
      REVIEW_EVENTS_TOPIC: review-events
      REVIEW_CONSUMER_GROUP: review-processor
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      INSTANCE_ID: processor-b
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.2.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./infra/docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"

  tempo:
    profiles: ["observability"]
    image: grafana/tempo:2.7.1
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./infra/docker/tempo/config.yaml:/etc/tempo.yaml:ro
    ports:
      - "${TEMPO_PORT:-3200}:3200"

  loki:
    profiles: ["observability"]
    image: grafana/loki:3.4.1
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./infra/docker/loki/config.yaml:/etc/loki/config.yaml:ro
    ports:
      - "${LOKI_PORT:-3100}:3100"

  otel-collector:
    profiles: ["observability"]
    image: otel/opentelemetry-collector-contrib:0.121.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./infra/docker/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "${OTEL_COLLECTOR_GRPC_PORT:-4317}:4317"
      - "${OTEL_COLLECTOR_HTTP_PORT:-4318}:4318"
    depends_on:
      - tempo

  promtail:
    profiles: ["observability"]
    image: grafana/promtail:3.4.1
    command: ["-config.file=/etc/promtail/config.yaml"]
    volumes:
      - ./infra/docker/promtail/config.yaml:/etc/promtail/config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - loki

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:11.5.2
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./infra/docker/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "${GRAFANA_PORT:-3002}:3000"
    depends_on:
      - prometheus
      - tempo
      - loki

volumes:
  postgres_data:
